# SkillSpector baseline — findings listed here are suppressed on future scans.
# See docs/SUPPRESSION.md in the skillspector package.
#
# Operator review: 2026-10-28, against morluto/rea@main
# (skill at .agents/skills/reverse-engineer-anything).
#
# This uses `rules` (glob by rule id) rather than the auto-generated per-fingerprint
# list. Reason: `skillspector baseline` emits ONE fingerprint per (rule, file, snippet)
# group, so the 37 findings on this skill collapsed to 18 fingerprints and the scan
# still exited 1. Rules express "this rule class was reviewed and accepted", which is
# what was actually verified.
#
# What was verified before accepting (not assumed):
#   * 0 executable files - the skill is SKILL.md + 7 markdown references. No
#     .ps1/.py/.sh/.js/.exe anywhere, so there is no code to execute.
#   * All 7 `references/*.md` links in SKILL.md resolve on disk.
#   * Both anchors AE1 flagged (`#rea-installed-as-a-client-plugin`,
#     `#repair-registration-when-needed`) resolve to real headings.
version: 2
scanner_version: 2.12.0
rules:
  # AE1 "Referenced artifact was not completely inspected" at 100% confidence is the
  # scanner's own documented parsing limitation on RELATIVE markdown links - it is
  # reporting that it could not follow `references/foo.md`, not that anything is
  # malicious. All 7 targets and both anchors were confirmed to exist.
  - id: AE1
    reason: "Relative markdown link the scanner cannot follow (documented parse limitation). All 7 references/ targets and both anchors verified to resolve on disk."
  # P9 + MP2 both fire on Markdown TABLE column-alignment padding. Verified by reading
  # the flagged lines: the whitespace is the column separator, the content sits to the
  # LEFT of it and is plainly visible. Nothing is hidden to the right of the padding.
  - id: P9
    reason: "Markdown table column-alignment whitespace. Content is visible to the left of the padding; nothing hidden. Verified by reading each flagged line."
  - id: MP2
    reason: "Context-window heuristic misfiring on the same table-alignment padding as P9. Prose-only markdown, no dynamic content assembly."
  # RA2 matched the word "sessions" in prose describing resource INSPECTION
  # ("Resource sessions have no..."). There is no persistence mechanism: the skill
  # ships no scripts, cron jobs or startup hooks.
  - id: RA2
    reason: "Matched the word 'sessions' in prose about resource inspection. No persistence mechanism exists - skill ships no scripts, hooks or startup entries."
  # EA2 matched human-in-the-loop guidance text ("Never auto-execute commands that
  # are destructive..."), i.e. the remediation the rule asks for is already present.
  - id: EA2
    reason: "Matched human-in-the-loop guidance text that already tells the agent never to auto-execute destructive operations. Advisory prose only."
  # RP1 flags `npx -y rea-agents@latest`, the bundle's OWN documented invocation,
  # present verbatim in setup/mcp.json.template. Pinning it here would desync the
  # skill from the MCP config the installer writes.
  - id: RP1
    reason: "Flags 'npx -y rea-agents@latest', which is this bundle's own documented invocation in setup/mcp.json.template. Pinning would desync skill from MCP config."
fingerprints: []
